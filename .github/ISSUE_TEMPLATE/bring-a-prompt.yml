name: Bring a prompt
description: Submit a safe-to-share prompt for a future BYOP workshop
title: "[Prompt]: "
labels: [prompt-submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for bringing your work. Everything entered here is public. Remove confidential, personal, regulated, and proprietary information before submitting.
  - type: input
    id: title
    attributes:
      label: Prompt title or job
      placeholder: Turn interview notes into product priorities
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to accomplish?
      description: Describe the useful outcome and who needs it.
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Your current prompt
      description: Paste a safe-to-share version.
      render: text
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: Where are you stuck?
      description: What does the output get wrong, miss, or make harder?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safe sharing
      options:
        - label: I have removed confidential, personal, regulated, and proprietary information.
          required: true
        - label: I agree to follow the BYOP Code of Conduct.
          required: true
